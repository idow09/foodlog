[project]
name = "foodlog"
version = "0.1.0"
description = "A Telegram bot that helps users track their food intake and calorie consumption by analyzing text descriptions and food images."
authors = [
    {name = "Ido Weiss",email = "idow@ai21.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.2.1",
    "python-dotenv>=1.1.0",
    "python-telegram-bot>=22.0",
    "openai (>=1.77.0,<2.0.0)",
]

[tool.poetry]
name = "foodlog"
version = "0.1.0"
description = "A Telegram bot that helps users track their food intake and calorie consumption by analyzing text descriptions and food images."
authors = ["Ido Weiss <idow@ai21.com>"]
readme = "README.md"
packages = [{include = "foodlog"}]

[tool.poetry.dependencies]
python = ">=3.11"
pillow = ">=11.2.1"
python-dotenv = ">=1.1.0"
python-telegram-bot = ">=22.0"
openai = ">=1.77.0,<2.0.0"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
